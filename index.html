<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090605" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Ambang Coffee House (demo): menjelajahi menu kopi lewat ruang demi ruang dengan navigasi perspektif 3D."
    />
    <title>Ambang Coffee House · Demo</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <link rel="preload" href="fonts/gloock-regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="fonts/instrument-sans-regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="images/coffee-hero.png" as="image" />

    <!-- @font-face ada di sini (bukan di CSS bundel) agar URL font relatif terhadap halaman. -->
    <style>
      @font-face {
        font-family: 'Gloock';
        src: url('fonts/gloock-regular.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('fonts/instrument-sans-regular.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('fonts/instrument-sans-bold.woff') format('woff');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      html {
        background: #090605;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Situs ini membutuhkan JavaScript untuk menampilkan ruang-ruang 3D.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
